name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Windows tests and package
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-test.txt

      - name: Check PowerShell syntax
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('Install.ps1', 'tools/deploy.ps1', 'tests/deploy_spec.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

      - name: Run Lua and installer lifecycle tests
        run: python tools/test.py

      - name: Test developer deployment in an isolated game folder
        run: ./tests/deploy_spec.ps1

      - name: Build and verify release ZIP
        run: python tests/package_spec.py

      - name: Upload tested build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SRankAlert-${{ github.sha }}
          path: dist/SRankAlert-*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
